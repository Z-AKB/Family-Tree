<style>

:root[data-theme="midnight"]{--bg:#0F1522;--card:#151C2C;--ink:#E7ECF4;--muted:#B7C0D1;--line:#27314A;--line-strong:#354060;--leaf:#4C9B6A;--leaf-ink:#7FC9A0;--leafsoft:#1A2538;--on-leaf:#0F1F16;--accent:#C9B07A;--accent-ink:#F0E2C3;--accentsoft:#232A3F;--coral:#E07A75;--on-coral:#1F1312;--lav:#24243A;--gone:#9AA3BF;--gone-ink:#C9D0E3;--surface-2:#121A2A;--shadow-sm:0 1px 1px rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.25);--shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.3);--shadow-lg:0 1px 2px rgba(0,0,0,.25),0 12px 36px rgba(0,0,0,.36);--font-head:'Source Serif 4','Iowan Old Style','Palatino','Georgia',serif;--font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--r-xs:4px;--r-sm:8px;--r:12px;--r-lg:16px;--r-pill:999px;color-scheme:dark}
:root[data-theme="blossom"]{--bg:#F9F6FA;--card:#FFFFFF;--ink:#231E28;--muted:#625B6B;--line:#E3DDE8;--line-strong:#C9C0D3;--leaf:#6F5AA6;--leaf-ink:#58458A;--leafsoft:#F4F1FA;--on-leaf:#FFFFFF;--accent:#B99FBF;--accent-ink:#5E4663;--accentsoft:#F6F3F8;--coral:#B94A6A;--on-coral:#FFFFFF;--lav:#ECE6F5;--gone:#8A8597;--gone-ink:#484252;--surface-2:#FCFBFD;--shadow-sm:0 1px 1px rgba(35,30,40,.01),0 1px 2px rgba(35,30,40,.02);--shadow:0 1px 2px rgba(35,30,40,.02),0 4px 12px rgba(35,30,40,.04);--shadow-lg:0 1px 2px rgba(35,30,40,.02),0 10px 30px rgba(35,30,40,.05);--font-head:'Source Serif 4','Iowan Old Style','Palatino','Georgia',serif;--font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--r-xs:4px;--r-sm:8px;--r:12px;--r-lg:16px;--r-pill:999px;color-scheme:light}
:root[data-theme="clean"]{--bg:#FFFFFF;--card:#FFFFFF;--ink:#111111;--muted:#3F3F3F;--line:#D9D9D9;--line-strong:#BFBFBF;--leaf:#0F62FE;--leaf-ink:#0B4CD6;--leafsoft:#F5F8FF;--on-leaf:#FFFFFF;--accent:#8F8F8F;--accent-ink:#1F1F1F;--accentsoft:#F7F7F7;--coral:#DA1E28;--on-coral:#FFFFFF;--lav:#F4F4F4;--gone:#6F6F6F;--gone-ink:#2F2F2F;--surface-2:#FAFAFA;--shadow-sm:none;--shadow:0 0 0 1px var(--line);--shadow-lg:0 0 0 1px var(--line-strong);--font-head:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--r-xs:4px;--r-sm:6px;--r:8px;--r-lg:10px;--r-pill:6px;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--font-body);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
h1,h2,h3,h4,h5,h6,.fun{font-family:var(--font-head);font-weight:600;margin:0;letter-spacing:-0.01em}
button,input,select,textarea{font:inh erit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:var(--r-xs)}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%, transparent);backdrop-filter:saturate(1.02) blur(8px);-webkit-backdrop-filter:saturate(1.02) blur(8px);border-bottom:1px solid var(--line)}
.header-inner{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:12px 24px;max-width:1180px;margin:0 auto}
.brand{order:1;display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.logo{flex:none;width:38px;height:38px;border-radius:var(--r);display:grid;place-items:center;border:1px solid var(--line);background:var(--surface-2);color:var(--leaf)}
.logo svg{width:20px;height:20px;display:block}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-title{font:600 16px/1.2 var(--font-head);overflow-wrap:anywhere}
.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
nav{order:3;flex:1 1 auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
nav a,nav button{border:0;background:none;padding:7px 12px;border-radius:var(--r-sm);font-weight:500;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:40px;transition:color .15s ease,background .15s ease}
nav a:hover,nav button:hover{color:var(--ink);background:var(--surface-2)}
nav [aria-current="page"]{color:var(--ink);font-weight:600;background:var(--surface-2)}
.nav-spacer{flex:1 1 auto}
.tw{order:4;display:flex;gap:8px;align-items:center}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:7px 12px;font-weight:500;color:var(--ink);min-height:40px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.tbtn:hover{background:var(--surface-2)}
#tp{position:absolute;right:24px;top:calc(100% + 8px);z-index:40;width:min(320px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px}
#tp[hidden]{display:none}
.topt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);text-align:left}
.topt:hover{background:var(--surface-2)}
.topt[aria-pressed="true"]{background:var(--leafsoft)}
.topt small{display:block;color:var(--muted)}
.sws{display:flex;flex:none}.sws i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);margin-right:-6px;background:var(--bg)}
.sws{padding-right:6px}
#sf{order:2;position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:0 10px;min-height:40px;min-width:220px;max-width:320px;box-shadow:var(--shadow-sm)}
#sf[hidden]{display:none}
#sf svg{width:16px;height:16px;color:var(--muted);flex:none}
#sf input{border:0;background:none;width:100%;padding:7px 0;outline:none}
#sf input::placeholder{color:var(--muted)}
#res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;z-index:35}
#res:empty{display:none}
#res a,#res p{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0;color:inherit;text-decoration:none}
#res a:hover,#res a:focus-visible{background:var(--surface-2)}
#res small{color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.intro{margin:8px 0 28px;max-width:680px}
.intro h2{font-size:clamp(28px,4vw,42px);line-height:1.1}
.intro p{color:var(--muted);margin:10px 0 0;max-width:560px}
.page-header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin:8px 0 24px}
.page-title-group{display:flex;flex-direction:column;gap:6px;max-width:680px}
.page-title{font-size:clamp(28px,4vw,40px);line-height:1.08}
.page-subtitle{color:var(--muted);max-width:560px}
.page-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r-sm);padding:8px 14px;font-weight:500;min-height:40px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:var(--shadow-sm);transition:background .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.btn.pri{background:var(--leaf);border-color:color-mix(in srgb,var(--leaf) 80%, var(--line));color:var(--on-leaf);font-weight:600}
.btn.pri:hover{filter:brightness(0.98)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.del{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 40%, var(--line))}
.btn.del:hover{background:color-mix(in srgb,var(--coral) 6%, transparent)}
.tree-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tree-card{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;text-decoration:none;color:inherit;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,border-color .15s ease,transform .15s ease}
.tree-card:hover{box-shadow:var(--shadow);border-color:var(--line-strong);transform:translateY(-1px)}
.tree-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tree-card-title{font:600 18px/1.3 var(--font-head)}
.tree-card-meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:14px}
.tree-card-footer{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.tree-card-link{display:inline-flex;align-items:center;gap:6px;color:var(--leaf-ink);font-weight:500}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);max-width:560px;margin:0 auto;overflow:hidden}
.form-card-header{padding:20px 24px 0;display:flex;flex-direction:column;gap:4px}
.form-card-title{font:600 22px/1.2 var(--font-head)}
.form-card-sub{color:var(--muted)}
.form-card-body{display:grid;gap:16px;padding:18px 24px 24px}
.form-section{display:grid;gap:12px}
.form-section-title{font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:grid;gap:6px}
.field-label{font-weight:500}
.field-hint{color:var(--muted);font-size:14px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:9px 12px;min-height:40px;box-shadow:var(--shadow-sm)}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-color:color-mix(in srgb,var(--leaf) 60%, var(--line))}
textarea{min-height:96px;resize:vertical;line-height:1.6}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.person{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;width:170px;text-align:center;text-decoration:none;color:inherit;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,border-color .15s ease,transform .15s ease}
.person:hover{box-shadow:var(--shadow);border-color:var(--line-strong);transform:translateY(-1px)}
.person b{font:600 16px/1.3 var(--font-head);overflow-wrap:anywhere}
.person small{color:var(--muted);font-size:14px}
.av{--s:76px;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font:600 calc(var(--s)*.32) var(--font-head);color:var(--ink);border:1px solid var(--line-strong);background-size:cover;background-position:center;background-color:var(--surface-2)}
.av.gone{color:var(--gone-ink)}
.tree{display:flex;flex-direction:column;align-items:center;gap:12px}
.stem{width:1px;height:24px;background:var(--line-strong)}
.branches{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;align-items:flex-start;width:100%}
.branch{display:flex;flex-direction:column;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:0 20px 18px;min-width:260px;max-width:100%}
.heart{margin-top:-14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:500 13px var(--font-body);padding:4px 12px;border-radius:var(--r-pill);box-shadow:var(--shadow-sm)}
.branch .person{margin-top:14px}
.more{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:7px 12px;font-weight:500;color:var(--ink);margin-top:14px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:38px}
.more[aria-expanded="true"]{background:var(--surface-2)}
.kids{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:14px}.kids[hidden]{display:none}
.group{margin-bottom:28px}.group h3{font-size:20px;margin-bottom:12px}
.page{max-width:760px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:7px 12px;font-weight:500;color:var(--ink);text-decoration:none;min-height:38px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;text-align:center;box-shadow:var(--shadow-sm)}.hero .av{--s:120px;margin:0 auto 12px}.hero h2{font-size:clamp(28px,4vw,38px);line-height:1.1}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:var(--r-pill);font-weight:500;background:var(--leafsoft);color:var(--leaf-ink);border:1px solid color-mix(in srgb,var(--leaf) 30%, var(--line))}.tag.gone{background:var(--lav);color:var(--gone-ink);border-color:color-mix(in srgb,var(--gone) 40%, var(--line))}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm)}.fact span{display:block;color:var(--muted);font-size:14px}.fact b{font:600 18px/1.3 var(--font-head)}
.page h3{margin:24px 0 12px;font-size:20px}
form.f{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--shadow-sm);display:grid;gap:14px;max-width:560px;margin:0 auto}
form.f label{display:grid;gap:6px;font-weight:500}form.f input,form.f select,form.f textarea{background:var(--card)}
.hint{color:var(--muted)}
.err{color:var(--coral);font-weight:500;min-height:1.4em}
#res a,#res p{font-size:14px}
@media (max-width:860px){
  .header-inner{padding:10px 16px;gap:10px}
  nav{order:4;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  nav a,nav button{flex:none;white-space:nowrap}
  #sf{order:2;flex:1 1 200px;min-width:0}
  .tw{order:3;margin-left:auto}
  main{padding:22px 16px 64px}
  .branch{min-width:0;width:100%;padding:0 16px 16px}
  .grid .person{width:calc(50% - 7px)}
}
@media (max-width:640px){
  .grid .person{width:100%}
  .tree-grid{grid-template-columns:1fr}
  form.f{padding:18px}
}
.chartbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:0 0 14px}
.chartwrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);max-height:74vh;cursor:grab;touch-action:pan-x pan-y pinch-zoom}
.cl{fill:none;stroke:var(--line-strong);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cn{fill:var(--card);stroke:var(--leaf);stroke-width:1.8}.cn.gone{stroke:var(--gone)}.cnode:hover .cn{stroke-width:2.4}
.cname{font:600 12px var(--font-head);fill:var(--ink)}.cdates{font:11px var(--font-body);fill:var(--muted)}.cin{font:600 11px var(--font-head);fill:var(--ink)}.cheart{font-size:14px;fill:var(--coral)}
.notes{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-sm);margin:0}
.relbox{display:grid;gap:10px}.relbox input{border-radius:var(--r-sm)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.album figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.album img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.album figcaption{padding:10px 12px;font-weight:500}.album figcaption small{display:block;font-weight:400;color:var(--muted)}
.srcs{list-style:none;padding:0;margin:0;display:grid;gap:10px}.srcs li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:12px 14px}.srcs p{margin:6px 0}.srcs small{color:var(--muted)}
.addatt{margin-top:18px}
.dup span,.iss span{display:block;color:var(--muted)}.iss.warn{border-left:3px solid var(--coral);padding-left:12px}
#lg{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:7px 10px;font-weight:500;min-height:40px}
@media print{header,.tw,#sf,nav,.btn,.more,.back,.chartbar{display:none!important}body{background:#fff;color:#000}.person,.hero,.fact,.tree-card,.form-card{box-shadow:none!important;border:1px solid #bbb}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

<header>
  <div class="header-inner">

      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18"></path>
          <path d="M7 7c1.5-1.5 3.5-2 5-2s3.5.5 5 2"></path>
          <path d="M7 12c1.5-1.5 3.5-2 5-2s3.5.5 5 2"></path>
          <path d="M7 17c1.5-1.5 3.5-2 5-2s3.5.5 5 2"></path>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title" id="title">Family Tree</div>
        <div class="brand-sub">Preserve and explore your family history</div>
      </div>
    </a>
    <form id="sf" role="search" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
